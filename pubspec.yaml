name: brisko
description: Brisko Pizza — hot, fresh, fast.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.4
  firebase_database: ^11.2.0
  firebase_messaging: ^15.1.6
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  intl: ^0.19.0
  url_launcher: ^6.3.1
  uuid: ^4.5.1
  shared_preferences: ^2.3.3
  http: ^1.2.2
  google_sign_in: ^6.2.2
  hugeicons: ^1.1.7
  lottie: ^3.3.1
  webview_flutter: ^4.10.0
  flutter_cashfree_pg_sdk: ^2.4.0+52

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  change_app_package_name: ^1.5.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/Brisko_logo.png
    - assets/animations/Delivery.json
